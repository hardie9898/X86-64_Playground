name: Build Fullscreen iOS IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build WebDir
        run: |
          npm install
          npm run build
          npx cap add ios
          npx cap sync ios

      - name: Keep new-window links inside WKWebView
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("ios/App/App/AppDelegate.swift")
          text = p.read_text()
          if "PopupInterceptor" not in text:
              text = text.replace("import Capacitor", "import Capacitor\nimport WebKit", 1)
              text = text.replace(
                  "var window: UIWindow?",
                  "var window: UIWindow?\n  private let popupInterceptor = PopupInterceptor()",
                  1
              )
              text = text.replace(
                  "return true\n  }",
                  "if let bridgeVC = window?.rootViewController as? CAPBridgeViewController {\n      bridgeVC.webView?.uiDelegate = popupInterceptor\n    }\n    return true\n  }",
                  1
              )
              text += """

          private class PopupInterceptor: NSObject, WKUIDelegate {
            func webView(
              _ webView: WKWebView,
              createWebViewWith configuration: WKWebViewConfiguration,
              for navigationAction: WKNavigationAction,
              windowFeatures: WKWindowFeatures
            ) -> WKWebView? {
              if navigationAction.targetFrame == nil || !(navigationAction.targetFrame!.isMainFrame) {
                if let url = navigationAction.request.url {
                  webView.load(URLRequest(url: url))
                }
              }
              return nil
            }
          }
          """
              p.write_text(text)
          '

      - name: Force Fullscreen & Landscape Only in Info.plist
        working-directory: ./ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" Info.plist || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" Info.plist || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" Info.plist || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" Info.plist

      - name: Build Unsigned IPA
        working-directory: ./ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET="-workspace App.xcworkspace"
          else
            BUILD_TARGET="-project App.xcodeproj"
          fi

          xcodebuild $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            SWIFT_VERSION=5.0 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r x86-playground.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86-playground-ipa
          path: ./ios/App/x86-playground.ipa
